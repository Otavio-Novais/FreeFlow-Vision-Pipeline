name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Testes Unitários
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    
    steps:
      - name:  Checkout do código
        uses: actions/checkout@v4
      
      - name: 🐍 Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: 🧪 Rodar testes com coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing
      
      - name: 📊 Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    name: Linting e Formatação
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4
      
      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      
      - name: 📦 Instalar linters
        run: |
          pip install flake8 black isort mypy
      
      - name: 🔍 Verificar formatação com Black
        run: black --check src/ tests/
      
      - name:  Verificar imports com isort
        run: isort --check-only src/ tests/
      
      - name: 🔍 Verificar estilo com Flake8
        run: |
          flake8 src/ tests/ --max-line-length=120 \
            --ignore=E203,W503,E501
      
      - name: 🔍 Verificar tipos com mypy (opcional)
        run: |
          mypy src/ --ignore-missing-imports \
            --disable-error-code=annotation-unchecked || true